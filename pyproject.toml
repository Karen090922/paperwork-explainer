[project]
name = "paperwork-explainer"
version = "0.1.0"
description = "Turns a photo of a bill or official letter into a plain-language explanation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-openai>=1.7",
    "pillow>=11",
    "pillow-heif>=0.18",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

# The build-system section makes `uv sync` install this project, so
# `from app.extract import ...` works from anywhere, including the Streamlit page.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
